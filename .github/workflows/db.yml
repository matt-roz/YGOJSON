name: Generate/Upload Database

on:
  workflow_dispatch:
  schedule:
   - cron: 0 0 */2 * *

permissions:
  contents: write
  actions: write

# a full run takes the better part of a day, and every job shares the same
# `temp`/`data` caches; two runs at once would trample each other's state
concurrency:
  group: db
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
        with:
          get-temp: false
          get-data: false
      - name: Lint
        run: |
          pre-commit run --all-files
      # fails in seconds when Yugipedia has grown a rarity we do not model,
      # rather than letting the run publish printings without one
      - name: Validate rarity coverage
        run: |
          python test/validate_rarity_coverage.py
      # offline, unlike the check above: there is no upstream list of print
      # values, so this can only fail because our own table regressed
      - name: Validate print status vocabulary
        run: |
          python test/validate_print_status.py
  pre-yugipedia:
    runs-on: ubuntu-latest
    needs: lint
    # the only job that reads Yugipedia's changelog, and the output diff at the
    # end of the run is only worth reading beside that figure; carried as a job
    # output rather than through the `temp`/`data` caches, which are
    # failure-tolerant and would hand on a previous run's count in silence
    outputs:
      changelog-pages: ${{ steps.changelog.outputs.pages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
        with:
          get-data: false
      - name: Run YGOJSON (Pre-Yugipedia)
        run: |
          ygojson --production --download --yugipedia-gen-partitions 8 --yugipedia-gen-partitions-prefix temp/part --no-yamlyugi --no-manual --individuals '' --no-individuals
      - name: Record Changelog Pages
        id: changelog
        run: |
          echo "pages=$(cat changelog-pages.txt 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      # An artifact rather than the `temp`/`data` caches, which are
      # failure-tolerant by design and would hand on a stale count in silence -
      # a run's warning sum quietly short by one job is worse than none,
      # because it presents as a measurement. Named for the job, which is
      # unique in a workflow, because artifact names must not collide.
      # `always()`, so a job that died still reports what it saw first.
      - name: Upload Warning Counts
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: warning-buckets-${{ github.job }}
          path: warning-buckets.json
          if-no-files-found: warn
      - name: Teardown
        uses: ./.github/actions/teardown
        if: always()
  yugipedia-1:
    runs-on: ubuntu-latest
    needs: pre-yugipedia
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run YGOJSON (Yugipedia 1)
        uses: ./.github/actions/yugipedia
        with:
          i: 1
  yugipedia-2:
    runs-on: ubuntu-latest
    needs: yugipedia-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run YGOJSON (Yugipedia 2)
        uses: ./.github/actions/yugipedia
        with:
          i: 2
  yugipedia-3:
    runs-on: ubuntu-latest
    needs: yugipedia-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run YGOJSON (Yugipedia 3)
        uses: ./.github/actions/yugipedia
        with:
          i: 3
  yugipedia-4:
    runs-on: ubuntu-latest
    needs: yugipedia-3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run YGOJSON (Yugipedia 4)
        uses: ./.github/actions/yugipedia
        with:
          i: 4
  yugipedia-5:
    runs-on: ubuntu-latest
    needs: yugipedia-4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run YGOJSON (Yugipedia 5)
        uses: ./.github/actions/yugipedia
        with:
          i: 5
  yugipedia-6:
    runs-on: ubuntu-latest
    needs: yugipedia-5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run YGOJSON (Yugipedia 6)
        uses: ./.github/actions/yugipedia
        with:
          i: 6
  yugipedia-7:
    runs-on: ubuntu-latest
    needs: yugipedia-6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run YGOJSON (Yugipedia 7)
        uses: ./.github/actions/yugipedia
        with:
          i: 7
  yugipedia-8:
    runs-on: ubuntu-latest
    needs: yugipedia-7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run YGOJSON (Yugipedia 8)
        uses: ./.github/actions/yugipedia
        with:
          i: 8
  post-yugipedia:
    runs-on: ubuntu-latest
    # `pre-yugipedia` is already a transitive dependency, so naming it changes
    # no ordering; it is named to reach its changelog page count
    needs: [pre-yugipedia, yugipedia-8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run YGOJSON (Post-Yugipedia)
        run: |
          ygojson --production --no-ygoprodeck --no-yamlyugi --no-yugipedia
      - name: Test
        run: |
          python test/validate_data.py
      - name: Push Individuals
        uses: s0/git-publish-subdir-action@v2.6.0
        env:
          REPO: self
          BRANCH: v1/individual # update this when we have new schema versions
          FOLDER: data/individual
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQUASH_HISTORY: true
      - name: Push Aggregates
        uses: s0/git-publish-subdir-action@v2.6.0
        continue-on-error: true # TODO: files too big; we need to enable git-lfs to remove this line
        env:
          REPO: self
          BRANCH: v1/aggregate # update this when we have new schema versions
          FOLDER: data/aggregate
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQUASH_HISTORY: true
      # Sits between the two publishes on purpose. The branch above is what
      # consumers track and has already landed, so nothing here can gate it;
      # the release asset below is the baseline this compares against, and the
      # steps that follow replace it. Reports only - never fails the run.
      - name: Report Output Diff
        continue-on-error: true
        env:
          CHANGELOG_PAGES: ${{ needs.pre-yugipedia.outputs.changelog-pages }}
        run: |
          set +e
          python -c "from ygojson import download_published_zip; download_published_zip('individual', 'baseline')" || rm -rf baseline
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python test/report_output_diff.py ${CHANGELOG_PAGES:+--changelog-pages "$CHANGELOG_PAGES"} baseline data/individual | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::This run's output could not be compared against the previously published release. See the run summary."
          fi
      - name: Archive Individuals
        uses: vimtor/action-zip@v1.2
        with:
          files: data/individual
          dest: individual.zip
      - name: Archive Aggregates
        uses: vimtor/action-zip@v1.2
        with:
          files: data/aggregate
          dest: aggregate.zip
      - name: Get Latest Release
        id: latest_release
        uses: gregziegan/fetch-latest-release@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove Old Individuals ZIP
        uses: flcdrg/remove-release-asset-action@v4.0.4
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.latest_release.outputs.id }}
          asset_name: individual.zip
      - name: Remove Old Aggregates ZIP
        uses: flcdrg/remove-release-asset-action@v4.0.4
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.latest_release.outputs.id }}
          asset_name: aggregate.zip
      - name: Upload Individuals ZIP
        uses: csexton/release-asset-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-url: ${{ steps.latest_release.outputs.upload_url }}
          file: individual.zip
      - name: Upload Aggregates ZIP
        uses: csexton/release-asset-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-url: ${{ steps.latest_release.outputs.upload_url }}
          file: aggregate.zip
      - name: Upload Warning Counts
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: warning-buckets-${{ github.job }}
          path: warning-buckets.json
          if-no-files-found: warn
      - name: Teardown
        uses: ./.github/actions/teardown
        if: always()
        with:
          set-data: false
  warning-summary:
    runs-on: ubuntu-latest
    # `post-yugipedia` transitively depends on every other job, so waiting on it
    # alone waits on all of them - and a job that was skipped because the chain
    # broke ahead of it counts as completed, so `always()` still fires here
    needs: post-yugipedia
    # A separate job rather than the end of `post-yugipedia`: the chain is
    # strictly sequential, so a failure in the middle abandons `post-yugipedia`
    # entirely, and the summary would be lost on exactly the runs worth reading
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
        with:
          get-temp: false
          get-data: false
      # No `merge-multiple`: every job's file is called `warning-buckets.json`,
      # so merging the artifacts into one directory would have them overwrite
      # each other and the sum would silently be one job's counts. Kept apart,
      # each file's directory also names the job that uploaded it.
      - name: Download Warning Counts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: warning-counts
          pattern: warning-buckets-*
      # Reports only - the database has already published by now, so a red run
      # here would be a false alarm about the data. `--expected` is how many
      # jobs upload counts (the pre-stage, eight partitions and the post-stage);
      # set it too low and a short sum reads as the run's total, which is the
      # one thing this must never do.
      - name: Sum Warning Counts
        continue-on-error: true
        run: |
          set +e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python test/sum_warning_buckets.py --expected 10 warning-counts | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Not every job's warning counts reached this summary, so the totals in the run summary are a lower bound."
          fi
